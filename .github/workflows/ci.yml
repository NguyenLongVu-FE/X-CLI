name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:audit
      - run: pnpm test:dist
      - run: pnpm test:browser-process
      - run: pnpm test:git-install
      - run: pnpm test:skill-install
      - if: github.event_name == 'push'
        run: XCLI_BIN_DIR="$RUNNER_TEMP/xcli-bin" pnpm install:mac && "$RUNNER_TEMP/xcli-bin/x" --help
